exclude: |
    ^fund/|
    ^assets/vendor/|
    ^node_modules/|
    ^venv/|
    ^.mypy_cache/|
    ^.ruff_cache/|
    ^coverage/|
    ^dist/|
    ^build/

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: end-of-file-fixer
            # Do not touch generated data CSVs
            exclude: ^data/.*\.csv$
          - id: trailing-whitespace
            # Do not touch generated data CSVs
            exclude: ^data/.*\.csv$
          - id: mixed-line-ending
            # Do not touch generated data CSVs
            exclude: ^data/.*\.csv$
          - id: detect-private-key

    - repo: https://github.com/igorshubovych/markdownlint-cli
      rev: v0.41.0
      hooks:
          - id: markdownlint
            args: ['--config', '.markdownlint.json']

    # JavaScript tooling (commit): format + lint
    - repo: local
      hooks:
          - id: prettier
            name: prettier (staged files)
            entry: env FORCE_COLOR=1 ./scripts/run-npx.sh -y -p prettier@3.8.1 prettier --write --log-level warn --config .prettierrc.cjs --ignore-path .prettierignore --
            language: system
            files: '\.(js|css|json|yml|yaml|md|html)$'
            pass_filenames: true
            stages: [pre-commit, manual]

    - repo: local
      hooks:
          - id: eslint
            name: eslint (staged JS)
            entry: env FORCE_COLOR=1 ./scripts/run-npx.sh -y -p eslint@10.7.0 eslint --config eslint.config.cjs --max-warnings=0 --no-warn-ignored --
            language: system
            types_or: [javascript]
            pass_filenames: true
            stages: [pre-commit, manual]

    - repo: local
      hooks:
          - id: stylelint
            name: stylelint (staged CSS)
            entry: env FORCE_COLOR=1 ./scripts/run-npx.sh -y -p stylelint@16.22.0 -p @stylistic/stylelint-plugin@4.0.0 stylelint --formatter=unix --config-basedir . --
            language: system
            types_or: [css]
            pass_filenames: true
            stages: [pre-commit, manual]

    # JS strict type check (whitelist grows incrementally; see
    # docs/js-typing-strategy.md). Project-wide, not per-file — tsc resolves
    # the whitelist from jsconfig.json itself.
    - repo: local
      hooks:
          - id: tsc
            name: tsc (jsconfig.json whitelist)
            entry: env FORCE_COLOR=1 ./scripts/run-npx.sh tsc -p jsconfig.json
            language: system
            types_or: [javascript]
            pass_filenames: false
            stages: [pre-commit, manual]

    # Dependency-structure gate (commit): no circular imports.
    # Rules: .dependency-cruiser.cjs. Runs via the local devDependency.
    - repo: local
      hooks:
          - id: dependency-cruiser
            name: dependency-cruiser (JS dependency structure)
            entry: env FORCE_COLOR=1 ./scripts/run-npx.sh dependency-cruiser js sw.js --config .dependency-cruiser.cjs
            language: system
            pass_filenames: false
            always_run: true
            stages: [pre-commit, manual]

    # JS tests (commit): related tests only. Scoped --findRelatedTests coverage
    # can never meet the whole-suite global thresholds in jest.config.cjs, so
    # they're disabled here (--coverageThreshold); the full-suite floor gates in
    # `make test` / CI instead. `set -o pipefail` is load-bearing: without it
    # the python output filter swallows jest's exit code and real test failures
    # would pass the hook.
    - repo: local
      hooks:
          - id: jest-related
            name: jest (related tests)
            entry: bash -c 'set -o pipefail; env FORCE_COLOR=1 ./scripts/run-npx.sh -y jest --colors --findRelatedTests --passWithNoTests --coverage --coverageThreshold="{}" "$@" 2>&1 | python3 -c "import sys; [sys.stdout.write(line) for line in sys.stdin if \"Ran all test suites\" not in line]"' --
            language: system
            types_or: [javascript]
            pass_filenames: true
            verbose: true

    # Full test suites (push): JS + Python
    - repo: local
      hooks:
          - id: jest-full
            name: jest (full, pre-push)
            entry: env FORCE_COLOR=1 ./scripts/run-npx.sh -y jest --ci --colors --runInBand
            language: system
            pass_filenames: false
            stages: [pre-push]

    - repo: local
      hooks:
          - id: pytest-full
            name: pytest (full, pre-push)
            entry: bash -lc 'pytest -q'
            language: system
            pass_filenames: false
            stages: [pre-push]

    # Optional: mypy type check on commit (adjust paths as needed)
    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v1.10.0
      hooks:
          - id: mypy
            files: '^scripts/|^tests/python/'
